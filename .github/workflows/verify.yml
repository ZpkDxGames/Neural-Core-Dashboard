name: Foundation verification

on:
  push:
    branches: [main, "development/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Alpha bootstrap has no lock file yet; generate and commit one before release.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --test backend/core-server.test.mjs
      - run: node --check backend/server.mjs
      - run: npm run typecheck
      - run: npm run build

# Install ONLY for the confirmed PostgreSQL cluster instance, e.g.
# /etc/systemd/system/postgresql@16-main.service.d/60-neural-core.conf
# Never install for all PostgreSQL services without identifying the cluster.
[Service]
Slice=neural-core.slice
CPUAccounting=yes
MemoryAccounting=yes
CPUWeight=10
IOWeight=20
MemoryHigh=640M
MemoryMax=768M
TasksMax=200
